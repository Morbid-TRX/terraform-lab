name: Terraform Remediation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "remediate" to confirm you want to apply fixes'
        required: true
        default: ''

jobs:
  remediate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'remediate'
        run: |
          echo "Invalid confirmation. Type 'remediate' to proceed."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start LocalStack
        run: |
          pip install localstack
          docker pull localstack/localstack
          docker run -d -p 4566:4566 -p 4510-4559:4510-4559 \
            --name localstack \
            -e LOCALSTACK_AUTH_TOKEN=${{ secrets.LOCALSTACK_AUTH_TOKEN }} \
            localstack/localstack
          sleep 15

      - name: Terraform Init
        run: terraform init
        working-directory: environments/local

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: environments/local

      - name: Run Infracost after remediation
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost report
        run: |
          infracost breakdown --path environments/local \
            --format table \
            --out-file infracost-report.txt
          cat infracost-report.txt

      - name: Notify Slack - Remediation Complete
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<EOF
          import urllib.request, json, os
          from datetime import datetime, timezone, timedelta
          webhook_url = os.environ.get("SLACK_WEBHOOK_URL")
          if webhook_url:
              try:
                  with open("infracost-report.txt", "r") as f:
                      content = f.read()
                  total_cost = "0.00"
                  for line in content.split("\n"):
                      if "OVERALL TOTAL" in line:
                          parts = line.split("$")
                          if len(parts) > 1:
                              total_cost = parts[-1].strip()
              except FileNotFoundError:
                  total_cost = "N/A"
              message = {
                  "text": "🔧 *Manual Remediation Complete*",
                  "attachments": [{
                      "color": "good",
                      "fields": [
                          {"name": "Status", "value": "Infrastructure restored to desired state.", "inline": False},
                          {"name": "Trigger", "value": "👤 Manual — approved by ${{ github.actor }}", "inline": True},
                          {"name": "Estimated Monthly Cost", "value": f"\${total_cost}/month", "inline": True},
                          {"name": "Time", "value": datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S MYT'), "inline": True}
                      ]
                  }]
              }
              data = json.dumps(message).encode("utf-8")
              req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
              print("Slack notification sent.")

      - name: Notify Slack - Pipeline Failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<EOF
          import urllib.request, json, os
          from datetime import datetime, timezone, timedelta
          webhook_url = os.environ.get("SLACK_WEBHOOK_URL")
          if webhook_url:
              message = {
                  "text": "❌ *Pipeline Failed!*",
                  "attachments": [{
                      "color": "danger",
                      "fields": [
                          {"name": "Workflow", "value": "${{ github.workflow }}", "inline": True},
                          {"name": "Triggered by", "value": "${{ github.actor }}", "inline": True},
                          {"name": "Run URL", "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}", "inline": False},
                          {"name": "Time", "value": datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S MYT'), "inline": True}
                      ]
                  }]
              }
              data = json.dumps(message).encode("utf-8")
              req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
              print("Slack failure notification sent.")
          EOF
