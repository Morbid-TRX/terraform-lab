name: Infrastructure Drift Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost cost estimate
        run: |
          infracost breakdown --path environments/local \
            --format table \
            --out-file infracost-report.txt
          cat infracost-report.txt

      - name: Run tfsec security scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: environments/local
          soft_fail: true

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          compact: true
          soft_fail: false
          config_file: .checkov.yaml

      - name: Run Bandit Python security scan
        run: |
          pip install bandit
          bandit drift_detector.py drift_simulator.py --ini .bandit

      - name: Start LocalStack
        run: |
          pip install localstack
          docker pull localstack/localstack
          docker run -d -p 4566:4566 -p 4510-4559:4510-4559 \
            --name localstack \
            -e LOCALSTACK_AUTH_TOKEN=${{ secrets.LOCALSTACK_AUTH_TOKEN }} \
            localstack/localstack
          echo "Waiting for LocalStack to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; then
              echo "LocalStack is ready after ${i} attempts"
              break
            fi
            echo "Attempt ${i}/30 - not ready yet, waiting 3s..."
            sleep 3
          done

      - name: Terraform Init
        run: terraform init
        working-directory: environments/local

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: environments/local

      - name: Run Drift Detector
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python drift_detector.py

      - name: Auto Remediate (scheduled only)
        if: github.event_name == 'schedule'
        working-directory: environments/local
        run: terraform apply -auto-approve

      - name: Notify Slack - Auto Remediation Complete
        if: github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<EOF
          import urllib.request, json, os
          from datetime import datetime, timezone, timedelta
          webhook_url = os.environ.get("SLACK_WEBHOOK_URL")
          if webhook_url:
              try:
                  with open("infracost-report.txt", "r") as f:
                      content = f.read()
                  total_cost = "0.00"
                  for line in content.split("\n"):
                      if "OVERALL TOTAL" in line:
                          parts = line.split("$")
                          if len(parts) > 1:
                              total_cost = parts[-1].strip()
              except FileNotFoundError:
                  total_cost = "N/A"
              message = {
                  "text": "🔧 *Auto Remediation Complete (Scheduled)*",
                  "attachments": [{
                      "color": "good",
                      "fields": [
                          {"name": "Status", "value": "Infrastructure automatically restored to desired state.", "inline": False},
                          {"name": "Trigger", "value": "⏰ Scheduled (automatic)", "inline": True},
                          {"name": "Estimated Monthly Cost", "value": f"\${total_cost}/month", "inline": True},
                          {"name": "Time", "value": datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S MYT'), "inline": True}
                      ]
                  }]
              }
              data = json.dumps(message).encode("utf-8")
              req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
              print("Slack notification sent.")

      - name: Notify Slack - Pipeline Failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python - <<EOF
          import urllib.request, json, os
          from datetime import datetime, timezone, timedelta
          webhook_url = os.environ.get("SLACK_WEBHOOK_URL")
          if webhook_url:
              message = {
                  "text": "❌ *Pipeline Failed!*",
                  "attachments": [{
                      "color": "danger",
                      "fields": [
                          {"name": "Workflow", "value": "${{ github.workflow }}", "inline": True},
                          {"name": "Triggered by", "value": "${{ github.actor }}", "inline": True},
                          {"name": "Run URL", "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}", "inline": False},
                          {"name": "Time", "value": datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S MYT'), "inline": True}
                      ]
                  }]
              }
              data = json.dumps(message).encode("utf-8")
              req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
              print("Slack failure notification sent.")
          EOF
